name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 依存の取得
        run: npm ci

      - name: 型検査
        run: npx tsc -b

      - name: ビルド
        run: npm run build

      # 論点39: 外部取得ゼロの担保。
      # 成果物に許可リスト外の外部URLが含まれていたらここで落とす。
      - name: 外部取得ゼロの検査
        run: npm run check:no-external
